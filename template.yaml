AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Weekly refresh of the mental health clinical trials pipeline. A Lambda function
  downloads trials from ClinicalTrials.gov, saves a dated snapshot to S3, loads
  it into PostgreSQL on RDS and emails you if a run fails.

Parameters:
  AlertEmail:
    Type: String
    Description: Email address for failure alerts (confirm the subscription email AWS sends)
  HomeIpCidr:
    Type: String
    Description: Your home IP address with /32 (for example 203.0.113.7/32). Only this address can reach the database from the internet.
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/(3[0-2]|[12]?\d)$
  DatabaseHours:
    Type: String
    Default: weekly-window
    AllowedValues: [weekly-window, always-on]
    Description: weekly-window starts the database Mondays 05:00 and stops it 07:30 Toronto time (start it by hand for Power BI); always-on leaves it running

Conditions:
  WeeklyWindow: !Equals [!Ref DatabaseHours, weekly-window]

Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true   # lets the load function start when a refresh finishes
      LifecycleConfiguration:
        Rules:
          - Id: raw-pages-to-infrequent-access
            Status: Enabled
            Prefix: raw/
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 30

  RefreshFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: pipeline.lambda_function.handler
      Runtime: python3.12
      MemorySize: 1536
      Timeout: 900
      Environment:
        Variables:
          BUCKET: !Ref DataBucket
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref DataBucket
      EventInvokeConfig:
        MaximumRetryAttempts: 0
      Events:
        Weekly:
          Type: ScheduleV2
          Properties:
            # Mondays at 06:00 Toronto time
            ScheduleExpression: cron(0 6 ? * MON *)
            ScheduleExpressionTimezone: America/Toronto
            RetryPolicy:
              MaximumRetryAttempts: 0

  RefreshLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${RefreshFunction}
      RetentionInDays: 90

  AlertTopic:
    Type: AWS::SNS::Topic

  AlertSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  RefreshFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The weekly trials refresh failed; see the function's CloudWatch logs
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref RefreshFunction
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  # Read-only user for the Streamlit app. Create its access key in the IAM console.
  AppReader:
    Type: AWS::IAM::User
    Properties:
      Policies:
        - PolicyName: read-latest-counts
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub ${DataBucket.Arn}/latest/*
                  - !Sub ${DataBucket.Arn}/history/*

  # ---------------------------------------------------------------------------
  # PostgreSQL on RDS, loaded after each refresh, read by Power BI.
  # Network: a small VPC with two public subnets (RDS needs subnets in two zones),
  # an internet gateway for Power BI, and a free S3 gateway endpoint for the load
  # function. No NAT gateway.
  # ---------------------------------------------------------------------------
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-vpc

  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]

  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.1.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  InternetRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetA
      RouteTableId: !Ref RouteTable

  SubnetBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetB
      RouteTableId: !Ref RouteTable

  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref RouteTable

  LoadSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Load function (outbound only)
      VpcId: !Ref Vpc

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL from your home IP and from the load function only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - Description: Power BI and setup script from home
          IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: !Ref HomeIpCidr
        - Description: Load function
          IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref LoadSecurityGroup

  DatabaseSubnets:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Two public subnets for the trials database
      SubnetIds:
        - !Ref SubnetA
        - !Ref SubnetB

  # Admin password, generated by Secrets Manager and never written in this file
  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Admin sign-in for the trials database (used only by tools/setup_database.py)
      GenerateSecretString:
        SecretStringTemplate: '{"username": "trials_admin"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete         # every table can be rebuilt from the S3 snapshots
    UpdateReplacePolicy: Delete
    DependsOn: GatewayAttachment
    Properties:
      Engine: postgres
      EngineVersion: "17.9"
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: "20"
      StorageType: gp3
      StorageEncrypted: true
      MultiAZ: false
      PubliclyAccessible: true
      DBName: trials
      MasterUsername: !Sub "{{resolve:secretsmanager:${DatabaseSecret}:SecretString:username}}"
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DatabaseSecret}:SecretString:password}}"
      EnableIAMDatabaseAuthentication: true
      DBSubnetGroupName: !Ref DatabaseSubnets
      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroup
      BackupRetentionPeriod: 1
      DeleteAutomatedBackups: true
      DeletionProtection: false
      AutoMinorVersionUpgrade: true
      EnablePerformanceInsights: false
      MonitoringInterval: 0

  LoadFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: pipeline.load_rds.handler
      Runtime: python3.12
      MemorySize: 512
      Timeout: 120
      VpcConfig:
        SubnetIds:
          - !Ref SubnetA
          - !Ref SubnetB
        SecurityGroupIds:
          - !Ref LoadSecurityGroup
      Environment:
        Variables:
          BUCKET: !Ref DataBucket
          DB_HOST: !GetAtt Database.Endpoint.Address
          DB_PORT: !GetAtt Database.Endpoint.Port
          DB_NAME: trials
          DB_USER: loader
          DB_READER: powerbi
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref DataBucket
        - Statement:
            - Effect: Allow
              Action: rds-db:connect
              Resource: !Sub arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${Database.DbiResourceId}/loader
      EventInvokeConfig:
        MaximumRetryAttempts: 0
      Events:
        RefreshFinished:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source: [aws.s3]
              detail-type: [Object Created]
              detail:
                bucket:
                  name: [!Ref DataBucket]
                object:
                  key: [history/counts.csv]   # the refresh writes this file last

  LoadLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${LoadFunction}
      RetentionInDays: 90

  LoadFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Loading the refresh into PostgreSQL failed; see the load function's CloudWatch logs
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref LoadFunction
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  # Weekly window: start before the Monday 06:00 refresh, stop after the load
  DatabaseSchedulerRole:
    Type: AWS::IAM::Role
    Condition: WeeklyWindow
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: start-stop-database
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - rds:StartDBInstance
                  - rds:StopDBInstance
                Resource: !Sub arn:aws:rds:${AWS::Region}:${AWS::AccountId}:db:${Database}

  StartDatabase:
    Type: AWS::Scheduler::Schedule
    Condition: WeeklyWindow
    Properties:
      Description: Start the trials database before the weekly refresh
      ScheduleExpression: cron(0 5 ? * MON *)
      ScheduleExpressionTimezone: America/Toronto
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: arn:aws:scheduler:::aws-sdk:rds:startDBInstance
        RoleArn: !GetAtt DatabaseSchedulerRole.Arn
        Input: !Sub '{"DbInstanceIdentifier": "${Database}"}'
        RetryPolicy:
          MaximumRetryAttempts: 0

  StopDatabase:
    Type: AWS::Scheduler::Schedule
    Condition: WeeklyWindow
    Properties:
      Description: Stop the trials database after the weekly load
      ScheduleExpression: cron(30 7 ? * MON *)
      ScheduleExpressionTimezone: America/Toronto
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: arn:aws:scheduler:::aws-sdk:rds:stopDBInstance
        RoleArn: !GetAtt DatabaseSchedulerRole.Arn
        Input: !Sub '{"DbInstanceIdentifier": "${Database}"}'
        RetryPolicy:
          MaximumRetryAttempts: 0

Outputs:
  BucketName:
    Value: !Ref DataBucket
  FunctionName:
    Value: !Ref RefreshFunction
  AppReaderUser:
    Description: IAM user whose access key goes in the Streamlit app's secrets
    Value: !Ref AppReader
  DatabaseEndpoint:
    Description: Server name for Power BI and tools/setup_database.py
    Value: !GetAtt Database.Endpoint.Address
  DatabaseId:
    Value: !Ref Database
  DatabaseSecretArn:
    Description: Secrets Manager secret with the admin sign-in
    Value: !Ref DatabaseSecret
  LoadFunctionName:
    Value: !Ref LoadFunction
