AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Weekly refresh of the mental health clinical trials pipeline. A Lambda function
  downloads trials from ClinicalTrials.gov, saves a dated snapshot to S3 and
  emails you if a run fails.

Parameters:
  AlertEmail:
    Type: String
    Description: Email address for failure alerts (confirm the subscription email AWS sends)

Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: raw-pages-to-infrequent-access
            Status: Enabled
            Prefix: raw/
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 30

  RefreshFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: pipeline.lambda_function.handler
      Runtime: python3.12
      MemorySize: 1536
      Timeout: 900
      Environment:
        Variables:
          BUCKET: !Ref DataBucket
          METRICS_NAMESPACE: !Ref AWS::StackName
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref DataBucket
      EventInvokeConfig:
        MaximumRetryAttempts: 0
      Events:
        Weekly:
          Type: ScheduleV2
          Properties:
            # Mondays at 06:00 Toronto time
            ScheduleExpression: cron(0 6 ? * MON *)
            ScheduleExpressionTimezone: America/Toronto
            RetryPolicy:
              MaximumRetryAttempts: 0

  RefreshLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${RefreshFunction}
      RetentionInDays: 90

  AlertTopic:
    Type: AWS::SNS::Topic

  AlertSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  RefreshFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The weekly trials refresh failed; see the function's CloudWatch logs
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref RefreshFunction
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  # One page for the weekly refresh: what each run counted, how long it took, and what failed.
  # Free tier: 3 dashboards and 10 custom metrics; this uses 1 dashboard and 4 metrics.
  RefreshDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Ref AWS::StackName
      DashboardBody: !Sub |
        {
          "start": "-P90D",
          "periodOverride": "inherit",
          "widgets": [
            {
              "type": "text", "x": 0, "y": 0, "width": 24, "height": 2,
              "properties": {
                "markdown": "## Weekly trials refresh\nRuns Mondays 06:00 Toronto time. Counts are trials that started 2010-2025; the published analysis (1 October 2026) has 14,724. A run that fails its checks saves nothing and shows up under Errors and Recent failures."
              }
            },
            {
              "type": "metric", "x": 0, "y": 2, "width": 18, "height": 4,
              "properties": {
                "title": "Latest run",
                "view": "singleValue",
                "region": "${AWS::Region}",
                "stat": "Maximum",
                "period": 86400,
                "metrics": [
                  ["${AWS::StackName}", "TrialsInWindow", {"label": "Trials 2010-2025"}],
                  [".", "TrialsChange", {"label": "Change since last run"}],
                  [".", "ApiTotal", {"label": "Studies the API returned"}],
                  [".", "RunSeconds", {"label": "Run time (s)"}]
                ]
              }
            },
            {
              "type": "alarm", "x": 18, "y": 2, "width": 6, "height": 4,
              "properties": {
                "title": "Failure alarm (emails you)",
                "alarms": ["${RefreshFailedAlarm.Arn}"]
              }
            },
            {
              "type": "metric", "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Trials that started 2010-2025, per run",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "stat": "Maximum",
                "period": 86400,
                "metrics": [["${AWS::StackName}", "TrialsInWindow", {"label": "Trials"}]],
                "annotations": {"horizontal": [{"label": "Published 2026-10-01", "value": 14724}]},
                "yAxis": {"left": {"showUnits": false}},
                "legend": {"position": "hidden"}
              }
            },
            {
              "type": "metric", "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Change in trials since the previous run",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "stat": "Maximum",
                "period": 86400,
                "metrics": [["${AWS::StackName}", "TrialsChange", {"label": "Change"}]]
              }
            },
            {
              "type": "metric", "x": 0, "y": 12, "width": 12, "height": 6,
              "properties": {
                "title": "Run time (seconds)",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "stat": "Maximum",
                "period": 86400,
                "metrics": [["${AWS::StackName}", "RunSeconds", {"label": "Run time"}]],
                "annotations": {"horizontal": [{"label": "Lambda timeout", "value": 900, "color": "#d62728"}]},
                "yAxis": {"left": {"min": 0, "showUnits": false}},
                "legend": {"position": "hidden"}
              }
            },
            {
              "type": "metric", "x": 12, "y": 12, "width": 12, "height": 6,
              "properties": {
                "title": "Runs and errors per day",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "stat": "Sum",
                "period": 86400,
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "${RefreshFunction}", {"label": "Runs"}],
                  [".", "Errors", ".", ".", {"label": "Errors", "color": "#d62728"}],
                  [".", "Throttles", ".", ".", {"label": "Throttles"}]
                ],
                "yAxis": {"left": {"min": 0, "showUnits": false}}
              }
            },
            {
              "type": "log", "x": 0, "y": 18, "width": 24, "height": 6,
              "properties": {
                "title": "Recent runs",
                "region": "${AWS::Region}",
                "view": "table",
                "query": "SOURCE '${RefreshLogs}' | filter ispresent(snapshot_date) | fields snapshot_date, trials_in_window, api_total, pages, seconds | sort @timestamp desc | limit 20"
              }
            },
            {
              "type": "log", "x": 0, "y": 24, "width": 24, "height": 6,
              "properties": {
                "title": "Recent failures",
                "region": "${AWS::Region}",
                "view": "table",
                "query": "SOURCE '${RefreshLogs}' | filter @message like /\\[ERROR\\]|Task timed out|Status: error/ | fields @timestamp, @message | sort @timestamp desc | limit 20"
              }
            }
          ]
        }

  # Read-only user for the Streamlit app. Create its access key in the IAM console.
  AppReader:
    Type: AWS::IAM::User
    Properties:
      Policies:
        - PolicyName: read-latest-counts
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub ${DataBucket.Arn}/latest/*
                  - !Sub ${DataBucket.Arn}/history/*

Outputs:
  BucketName:
    Value: !Ref DataBucket
  FunctionName:
    Value: !Ref RefreshFunction
  DashboardUrl:
    Description: CloudWatch dashboard for the weekly refresh
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards/dashboard/${RefreshDashboard}
  AppReaderUser:
    Description: IAM user whose access key goes in the Streamlit app's secrets
    Value: !Ref AppReader
